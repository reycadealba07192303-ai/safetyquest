# Builds the student app for the web and publishes it to GitHub Pages at
# https://<owner>.github.io/<repo>/ . iPhone students open that address in Safari and
# choose Share > Add to Home Screen, which installs it like an app (no App Store, no
# Apple Developer account). Android and desktop browsers can use it too.
#
# One-time setup in the repo:
#   1. Settings > Pages > Build and deployment > Source: GitHub Actions.
#   2. Settings > Secrets and variables > Actions > Variables > API_BASE_URL = the
#      https:// address of the school server (the same value the Android build uses).
#   3. On the school server set WEB_APP_ORIGIN to the Pages origin if it is not
#      https://reycadealba07192303-ai.github.io (it is the default).
name: Publish web app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/web-app.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify media files were downloaded
        run: python3 tool/check_media.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Check the server address is set
        run: |
          if [ -z "${{ vars.API_BASE_URL }}" ]; then
            echo "::error::Add an API_BASE_URL variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - run: flutter pub get

      - name: Build for the web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Verify packaged web media
        run: python3 tool/check_media.py build/web/assets/assets build/web/icons

      - name: Version browser assets to avoid stale image caches
        run: python3 tool/package_web.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: mobile/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live onboarding image
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os
          import time
          import urllib.request

          url = os.environ['PAGE_URL'].rstrip('/') + '/releases/' + os.environ['GITHUB_SHA'] + '/assets/assets/cool_student.png'
          for attempt in range(6):
              try:
                  request = urllib.request.Request(url + '?verify=' + os.environ['GITHUB_SHA'])
                  with urllib.request.urlopen(request, timeout=30) as response:
                      signature = response.read(8)
                  if signature == b'\x89PNG\r\n\x1a\n':
                      print('Live onboarding image is a real PNG:', url)
                      break
                  raise RuntimeError('Live image is not a PNG; it may still be an LFS pointer')
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(10)
          PY
